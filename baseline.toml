[baseline]
name = "proof"
extends = ["shadcn-strict", "dependency-hygiene", "security", "ai-codegen"]
# scripts: CLIs may log. *-example.tsx: shadcn demo code, full of raw colors by design. *.gen.ts:
# generated (TanStack's route tree is full of `as any`). docs: agent prompts, not product text.
exclude = ["scripts/**", "packages/ui/src/components/examples/**", "**/*.gen.ts", "docs/**"]

# React correctness rules for the app code we write (not the vendored shadcn components). Dropped:
# max-component-size, prefer-use-reducer and no-direct-document-query are opinions (and the DOM
# queries are in tests); no-array-index-key flags the three positional lists here (highlighter tokens,
# OTP slots) where the index is the identity; no-new-function is re-added below without tests, since
# theme.test.ts runs the pre-paint script with it.
[[baseline.scoped]]
preset = ["react", "accessibility"]
path = "apps/app"
exclude_rules = ["max-component-size", "prefer-use-reducer", "no-direct-document-query", "no-array-index-key", "no-new-function"]

# The marketing site's sections are React components, server-rendered by Astro: the same rules as
# the app. The DOM queries are in tests; the index keys are placeholder slots (the logo strip), whose
# only identity is their position.
[[baseline.scoped]]
preset = ["react", "accessibility"]
path = "apps/site"
exclude_rules = ["max-component-size", "no-direct-document-query", "no-array-index-key"]

[[baseline.scoped]]
preset = "accessibility"
path = "packages/ui/src/dplus"

# Overrides the shadcn-strict rule of the same id (presets are replaced whole): identical except
# the overlay scrim used by shadcn's dialog, alert-dialog, sheet and drawer (Sera), which is
# intentionally the same in both themes.
[[rule]]
id = "enforce-dark-mode"
type = "tailwind-dark-mode"
severity = "error"
glob = "**/*.{tsx,jsx}"
message = "Missing dark: variant for color class"
suggest = "Use a shadcn semantic token class or add an explicit dark: counterpart"
allowed_classes = ["bg-black/20"]

# Overrides the preset's no-console-log (a warning that only matched log/debug): every console
# method is an error. Log with @proof/logger; CLIs write to process.stdout/stderr.
[[rule]]
id = "no-console-log"
type = "banned-pattern"
severity = "error"
glob = "**/*.{ts,tsx,js,jsx,mjs,cjs}"
exclude_glob = ["**/scripts/**"]
regex = true
skip_strings = true
pattern = "\\bconsole\\.(log|debug|info|warn|error|trace)\\("
message = "Use @proof/logger instead of console"
suggest = "import { createLogger } from \"@proof/logger\"; const log = createLogger({ name: \"...\" })"

[[rule]]
id = "use-proof-logger"
type = "banned-import"
severity = "error"
glob = "**/*.{ts,tsx,js,jsx,mjs,cjs}"
exclude_glob = ["packages/logger/**"]
packages = ["pino", "winston", "bunyan", "consola", "loglevel"]
message = "Log through @proof/logger (it redacts secrets)"
suggest = "import { createLogger } from \"@proof/logger\""

[[rule]]
id = "use-cn"
type = "banned-import"
severity = "error"
glob = "**/*.{ts,tsx,js,jsx}"
packages = ["clsx", "tailwind-merge", "classnames"]
message = "Merge class names with cn"
suggest = "import { cn } from \"cn\""

# Primitives and component kits belong in packages/ui (shadcn base-sera, on Base UI). Apps import
# components from @proof/ui; add new ones there with the shadcn CLI.
[[rule]]
id = "use-proof-ui"
type = "banned-import"
severity = "error"
glob = "**/*.{ts,tsx,js,jsx}"
exclude_glob = ["packages/ui/**"]
packages = [
  "@base-ui/react",
  "@radix-ui",
  "radix-ui",
  "@headlessui",
  "@ark-ui",
  "react-aria-components",
  "@mui",
  "@chakra-ui",
  "@mantine",
  "antd",
  "react-bootstrap",
]
message = "Use components from @proof/ui instead of a UI library directly"
suggest = "Import from @proof/ui, or add the component there with npx shadcn@latest add <name>"

# Env vars are read and validated in packages/env. Exceptions: tests (e2e tests run in the e2e
# runner, not with the app's env), build-tool configs, the
# logger (LOG_LEVEL, read before anything else loads), createDb's default URL and the CLI, which
# runs on a customer's machine rather than with the server's env.
[[rule]]
id = "use-proof-env"
type = "banned-pattern"
severity = "error"
glob = "**/*.{ts,tsx,js,jsx,mjs,cjs}"
exclude_glob = [
  "packages/env/**",
  "**/scripts/**",
  "**/*.test.{ts,tsx}",
  "**/*.e2e.ts",
  "**/*.config.{ts,mts,js,mjs}",
  "packages/logger/src/index.ts",
  "packages/db/src/index.ts",
  "packages/cli/src/bin.ts",
]
skip_strings = true
pattern = "process.env"
message = "Read env vars through @proof/env"
suggest = "Add the variable to packages/env and .env.example, then import env from @proof/env"

# Overrides the security preset's no-env-files, which fails on any `.env` on disk, including the local,
# gitignored one the setup creates (`cp .env.example .env`); it checks presence, not git, and ignores
# `exclude`. `.gitignore` (`.env*`) and gitleaks keep env files out of commits; this still refuses
# deploy env files in the tree.
[[rule]]
id = "no-env-files"
type = "file-presence"
severity = "error"
forbidden_files = [".env.production", ".env.staging"]
message = "Deploy env files don't belong in the repo: keep them in the platform's secret store"

# Overrides ai-codegen's no-type-any, whose pattern also matched "any" in prose comments. Type positions
# only. packages/api/src/operation.ts keeps `Operation<any, any>` on purpose (see its comment).
[[rule]]
id = "no-type-any"
type = "banned-pattern"
severity = "error"
glob = "**/*.{ts,tsx}"
exclude_glob = ["packages/api/src/operation.ts"]
regex = true
skip_strings = true
pattern = ":\\s*any\\b|<any\\b|,\\s*any[,>]|\\bas any\\b"
message = "Avoid 'any'; use a specific type or 'unknown'"

# Overrides shadcn-strict's no-inline-styles for the styles Tailwind can't express because they are
# computed at runtime: virtualized lists (TanStack Virtual's spacer heights and row offsets) and the
# design-system stories (a swatch per token, a grid sized to its columns). Everywhere else the rule holds.
[[rule]]
id = "no-inline-styles"
type = "banned-pattern"
severity = "warning"
glob = "**/*.{tsx,jsx}"
exclude_glob = [
  "apps/app/src/pages/admin-page.tsx",
  "apps/app/src/pages/members-page.tsx",
  "apps/app/src/pages/org-home-page.tsx",
  "packages/ui/src/dplus/pages/**",
]
pattern = "style={{"
message = "Avoid inline styles — use Tailwind utility classes instead"
suggest = "Replace style={{ ... }} with Tailwind classes"

[[rule]]
id = "no-new-function"
type = "banned-pattern"
severity = "error"
glob = "**/*.{ts,tsx,js,mjs}"
exclude_glob = ["**/*.test.{ts,tsx}"]
pattern = "new Function("
message = "new Function() is eval; no dynamic code execution"

# ── Rules from AGENTS.md that were prose until now ────────────────────────────────────────────────

# Without these two imports Tailwind silently drops the data-open:/data-closed: variants and the
# animate-in/animate-out utilities, and typecheck won't notice.
[[rule]]
id = "ui-css-shadcn-import"
type = "required-pattern"
severity = "error"
glob = "packages/ui/src/styles.css"
pattern = "@import \"shadcn/tailwind.css\""
message = "packages/ui/src/styles.css must keep @import \"shadcn/tailwind.css\""

[[rule]]
id = "ui-css-animate-import"
type = "required-pattern"
severity = "error"
glob = "packages/ui/src/styles.css"
pattern = "@import \"tw-animate-css\""
message = "packages/ui/src/styles.css must keep @import \"tw-animate-css\""

# Server-only packages never reach a client bundle or a customer's machine.
[[rule]]
id = "no-server-imports-in-client"
type = "banned-import"
severity = "error"
glob = "{apps/app,packages/ui,packages/sdk,packages/cli}/**/*.{ts,tsx}"
packages = ["@proof/db", "@proof/env", "@proof/auth-proofs", "@proof/observability"]
message = "Server-only package imported from client code"
suggest = "Go through the API (@proof/sdk) or move the shared piece to a package both sides can use"

# Handlers and data access throw AppError (clients get error.toPublic()); bare Error leaks nothing but
# also carries no code.
[[rule]]
id = "use-app-error"
type = "banned-pattern"
severity = "error"
glob = "apps/api/src/**/*.ts"
exclude_glob = ["**/*.test.ts", "**/*.test.helpers.ts"]
skip_strings = true
pattern = "new Error("
message = "Throw AppError from @proof/errors"
suggest = "throw new AppError(\"INTERNAL\", \"...\")"

[[rule]]
id = "no-focused-tests"
type = "banned-pattern"
severity = "error"
glob = "**/*.{test,e2e}.{ts,tsx}"
regex = true
pattern = "\\b(it|test|describe)\\.only\\("
message = "A focused test skips the rest of the suite"

[[rule]]
id = "no-sleep-in-e2e"
type = "banned-pattern"
severity = "error"
glob = "e2e/**/*.ts"
skip_strings = true
pattern = "sleep("
message = "No sleep in e2e tests; use matchers, which retry"

[[rule]]
id = "e2e-test-import"
type = "required-pattern"
severity = "error"
glob = "e2e/**/*.e2e.ts"
pattern = "from \"@e2e-dev/web\""
message = "Import test from @e2e-dev/web (it provides app, screen, browser); expect from e2e"

# The floor itself.
[[rule]]
id = "required-files"
type = "file-presence"
severity = "error"
required_files = ["AGENTS.md", "GLOSSARY.md", ".env.example", "SECURITY.md", "lefthook.yml", "baseline.toml", ".github/workflows/ci.yml", "packages/env/src/index.ts", "packages/config/vitest.base.ts"]
message = "A file the checks depend on is missing"

# ── Ratchets: ceilings that only go down. Lower max_count with `baseline ratchet down <id>` ───────

[[rule]]
id = "no-cross-package-relative-imports"
type = "banned-pattern"
severity = "error"
glob = "{apps,packages}/**/*.{ts,tsx}"
regex = true
pattern = "from \"(\\.\\./)+(apps|packages)/"
message = "Import another package through its name, not a relative path into its src"
suggest = "Export it from the package (apps/app gets the auth catalog from @proof/auth/client)"

[[rule]]
id = "ratchet-as-unknown-as"
type = "ratchet"
severity = "error"
glob = "{apps,packages}/**/*.{ts,tsx}"
exclude_glob = ["**/*.test.{ts,tsx}", "**/*.types.ts", "**/test-helpers.ts", "**/*.test.helpers.ts"]
pattern = "as unknown as"
max_count = 0
message = "Double casts hide type errors; fix the type at the source"

[[rule]]
id = "ratchet-vi-mock"
type = "ratchet"
severity = "error"
glob = "**/*.test.{ts,tsx}"
pattern = "vi.mock("
max_count = 0
message = "Prefer the real module (PGlite, fake SES, in-process app) over vi.mock"

[[rule]]
id = "ratchet-lint-disable"
type = "ratchet"
severity = "error"
glob = "{apps,packages,e2e}/**/*.{ts,tsx}"
regex = true
pattern = "(oxlint|eslint)-disable|biome-ignore"
max_count = 0
message = "Fix the lint error instead of disabling the rule"

[[rule]]
id = "ratchet-ts-expect-error"
type = "ratchet"
severity = "error"
glob = "{apps,packages,e2e}/**/*.{ts,tsx}"
exclude_glob = ["**/*.types.ts"]
regex = true
pattern = "@ts-(ignore|expect-error|nocheck)"
max_count = 0
message = "Fix the type error (type-level tests in *.types.ts may use @ts-expect-error)"

[[rule]]
id = "ratchet-skipped-tests"
type = "ratchet"
severity = "error"
glob = "**/*.{test,e2e}.{ts,tsx}"
regex = true
pattern = "\\b(it|test|describe)\\.skip\\("
max_count = 0
message = "A skipped test is a missing test"

# ── Tenant data stays behind proofs ───────────────────────────────────────────────────────────────
# apps/api handlers never query the database themselves: they call a function in apps/api/src/data/
# whose signature demands a gdp-ts proof (see the gdp-ts and agent-api skills). A query in a handler
# has skipped the proof. Table imports are banned there for the same reason; `import type { Database }`
# is fine. apps/api/src/authorization.test.ts checks the other half: every operation's permissions.
[[rule]]
id = "api-queries-in-data-layer"
type = "banned-pattern"
severity = "error"
glob = "apps/api/src/**/*.ts"
exclude_glob = ["apps/api/src/data/**", "**/*.test.ts", "**/*.test.helpers.ts"]
regex = true
skip_strings = true
pattern = "\\b(db|tx)\\.(select|insert|update|delete|query|execute|transaction)\\("
message = "Query the database from apps/api/src/data/, in a function that takes a proof"
suggest = "Add or reuse a function in apps/api/src/data/ that takes Named<O, OrganizationId> and a proof"

[[rule]]
id = "api-tables-in-data-layer"
type = "banned-pattern"
severity = "error"
glob = "apps/api/src/**/*.ts"
exclude_glob = ["apps/api/src/data/**", "apps/api/src/server.ts", "**/*.test.ts", "**/*.test.helpers.ts"]
regex = true
pattern = "^(import \\{[^}]*\\}|\\}) from \"@proof/db\""
message = "Only apps/api/src/data/ imports tables from @proof/db; elsewhere use import type { Database }"
