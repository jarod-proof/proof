name: Factory hq CI
permissions:
  contents: read

# Factory-owned (templates/static in the factory repo; do not edit in an org by hand). hq's tests
# for the spend cap and for grant requests need real Postgres and separate connections: PGlite
# cannot show two transactions interleaving. Without a database named *_test (or *_wt_*) they skip,
# and a skipped race test looks the same as a passing one. This job gives them a throwaway
# Postgres, fails if any of them still skips, and runs hq's and the Slack journeys' e2e targets.
# It needs no secrets: the database is a service container that dies with the job.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: factory-hq-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hq:
    name: hq on real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: proof_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U user -d proof_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # One disposable database for starter's tables (DATABASE_URL), hq's own `hq` schema
      # (HQ_DATABASE_URL), the race tests (HQ_TEST_DATABASE_URL, which must be named *_test) and the
      # e2e stacks (which refuse any other name).
      DATABASE_URL: postgres://user:pass@localhost:5432/proof_test
      HQ_DATABASE_URL: postgres://user:pass@localhost:5432/proof_test
      HQ_TEST_DATABASE_URL: postgres://user:pass@localhost:5432/proof_test
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      - name: Resolve the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Starter's migrations (the auth tables hq signs in with), then hq's own, on the same database.
      - name: Apply starter's migrations
        run: node scripts/release.mjs
      - name: Apply hq's migrations
        run: pnpm --filter @proof/hq exec drizzle-kit migrate
      - name: hq tests
        run: >-
          pnpm --filter @proof/hq test
          --reporter=default --reporter=json
          --outputFile.json="$GITHUB_WORKSPACE/hq-test.json"
      - name: The real-Postgres tests ran and passed (none skipped)
        run: node scripts/assert-hq-real-postgres.mjs hq-test.json
      # A throwaway secret per run; the stacks refuse to boot without one.
      - name: Generate BETTER_AUTH_SECRET
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "BETTER_AUTH_SECRET=$secret" >> "$GITHUB_ENV"
      - run: pnpm exec e2e-web install chromium --with-deps
      - run: pnpm e2e:hq
      - run: pnpm e2e:slack
      # Uploaded on failure too: the logs are the only evidence when a stack fails to boot.
      - name: Upload the reports and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: factory-hq-ci
          path: |
            hq-test.json
            .e2e/report.json
            .e2e/artifacts
            .e2e/logs
          if-no-files-found: warn
          retention-days: 7
