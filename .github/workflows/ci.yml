name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # Conventional Commit titles, the same types commitlint accepts (AGENTS.md, "Commits").
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      # mise-action installs pnpm 12. mise reads .mise.toml without `mise trust` when CI and
      # GITHUB_ACTIONS are set (checked locally with those variables set; a plain run is refused).
      - name: Resolve the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Conventional commits (PR range)
        if: github.event_name == 'pull_request'
        run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - run: gitleaks git --redact --config .gitleaks.toml
      - run: pnpm baseline
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Generated files must match what the generators write now. The vite build above has already
      # rewritten routeTree.gen.ts. Neither the drizzle nor the auth schema generator needs a database
      # (auth.cli.ts uses a placeholder). The formatter runs over the output first, so only content
      # drift fails. openapi.json is checked by the contract test instead.
      - name: Generated files are current
        run: |
          pnpm --filter @proof/db db:generate
          pnpm --filter @proof/auth generate
          pnpm --filter @proof/sdk generate
          pnpm stories
          pnpm biome format --write packages/db/src/auth-schema.ts packages/ui/src/components
          git add --intent-to-add packages/db
          git diff --exit-code -- apps/app/src/routeTree.gen.ts packages/db packages/sdk/src/schema.gen.ts packages/ui/src/components
          test -z "$(git ls-files --others --exclude-standard -- packages/ui/src/components)"
      - run: pnpm test:coverage
      - run: pnpm format:check


  # Its own job: a newly published advisory turns it red on any PR, whatever the diff. Ignored
  # advisories, each with its reason, are `auditConfig.ignoreGhsas` in pnpm-workspace.yaml.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      # Reads the lockfile only, so no install. A registry outage passes rather than failing the run.
      - run: pnpm audit --ignore-registry-errors

  # The browser journeys in e2e/ against apps/api and the web dev server (scripts/e2e-stack.mjs) on a
  # fresh Postgres. The stack signs up and promotes the admin account itself, and no journey has an
  # agent step, so the job needs no secrets and runs on fork PRs. The `visual` tests are left out:
  # they save screenshots to compare with the boards by hand.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: proof
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U user -d proof"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://user:pass@localhost:5432/proof
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      - name: Resolve the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Apply the migrations
        run: node scripts/release.mjs
      # A throwaway secret per run; the stack refuses to boot without one.
      - name: Generate BETTER_AUTH_SECRET
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "BETTER_AUTH_SECRET=$secret" >> "$GITHUB_ENV"
      - run: pnpm exec e2e-web install chromium --with-deps
      - run: pnpm exec e2e run --target desktop,phone --exclude-tag visual --reporter list,junit
      # Uploaded on failure too: the app log is the only evidence when the stack fails to boot.
      - name: Upload the report and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e
          path: |
            .e2e/report.json
            .e2e/junit.xml
            .e2e/artifacts
            .e2e/logs
          if-no-files-found: warn
          retention-days: 7

  openapi:
    name: OpenAPI breaking changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Extract the base contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_SHA:apps/api/openapi.json" 2>/dev/null; then
            git show "$BASE_SHA:apps/api/openapi.json" > base-openapi.json
          else
            echo "::notice::apps/api/openapi.json is not on the base branch; nothing to compare"
          fi
      # review: false keeps both specs inside CI; the action otherwise uploads them to oasdiff.com.
      - name: Fail on breaking changes
        if: hashFiles('base-openapi.json') != ''
        uses: oasdiff/oasdiff-action/breaking@514e22ec2f1d1654fb78ac3bb7dc00d8f3c6c4d9 # v0.1.19
        with:
          base: base-openapi.json
          revision: apps/api/openapi.json
          fail-on: ERR
          review: "false"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
