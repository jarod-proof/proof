# Local Postgres for dev: `docker compose up -d db`, then use the DATABASE_URL from .env.example.
# Tests don't need this; they use in-process PGlite (@proof/db/testing).
# The fixed project name makes every worktree share this one database server (`pnpm wt`).
name: proof
services:
  db:
    image: postgres:17-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: proof
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d proof"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot release step: applies the migrations, then exits 0. The api starts only after it succeeds.
  migrate:
    build: .
    working_dir: /app
    command: ["node", "scripts/release.mjs"]
    environment:
      DATABASE_URL: postgres://user:pass@db:5432/proof
    depends_on:
      db:
        condition: service_healthy

  # The API image (built from the Dockerfile) against the compose database. Needs BETTER_AUTH_SECRET
  # and EMAIL_FROM in your shell or an interpolation env file; see .env.example.
  api:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://user:pass@db:5432/proof
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (openssl rand -base64 32)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
